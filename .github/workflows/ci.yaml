name: image-build-push

on:
  push:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  lint-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install asdf & tools
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.asdf/installs/golang
            ~/.asdf/plugins/golang
            ~/.asdf/installs/golang/*/packages/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-${{ hashFiles('**/go.sum') }}

      - name: Run golangci-lint
        run: |
          set -x
          golangci-lint cache status
          golangci-lint run --timeout=10m

      - name: Test
        run: |
          set -x
          go test -tags dev ./...

      - name: Build
        run: |
          set -x
          CGO_ENABLED=0	go build -trimpath -ldflags="-s -w -extldflags '-static'" -o createos main.go
          ldd createos || true
