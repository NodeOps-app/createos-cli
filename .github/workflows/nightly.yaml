name: nightly

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: createos
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="nightly-$(date -u +%Y-%m-%d)"
          PKG="github.com/NodeOps-app/createos-cli/internal/pkg/version"
          CFG="github.com/NodeOps-app/createos-cli/internal/config"
          COMMIT="${{ github.sha }}"
          LDFLAGS="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Channel=nightly -X ${PKG}.Commit=${COMMIT} -X ${CFG}.OAuthClientID=${{ secrets.OAUTH_CLIENT_ID }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY="createos-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
          else
            BINARY="createos-${{ matrix.goos }}-${{ matrix.goarch }}"
          fi
          go build -trimpath -ldflags="${LDFLAGS}" -o "${BINARY}" .
          sha256sum "${BINARY}" | awk '{print $1}' > "${BINARY}.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: createos-*
          retention-days: 1

  release:
    needs: build
    runs-on: createos
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Write commit SHA
        run: echo -n "${{ github.sha }}" > commit.txt

      - name: Delete existing nightly release
        run: |
          gh release delete nightly --repo ${{ github.repository }} --yes || true
          git push --delete origin nightly || true

      - name: Create nightly release
        run: |
          gh release create nightly \
            --title "nightly ($(date -u +%Y-%m-%d))" \
            --notes "Automated nightly build from the latest commit on main." \
            --prerelease \
            createos-* commit.txt
